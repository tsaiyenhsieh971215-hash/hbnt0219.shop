<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姆熊の窩 ｜ 後台管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FBF9F5] text-[#584E42] pb-24">
    <header class="bg-white border-b border-warmprimary/20 p-4 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="font-bold">⚙️ 姆熊の窩 ｜ 商品與訂單管理</h1>
            <a href="index.html" class="text-sm text-amber-700 font-medium">返回前台 →</a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 space-y-6">
        <div class="bg-white rounded-3xl p-5 shadow-sm border">
            <h2 class="font-bold mb-3 text-lg">✨ 新增商品 / 委託 / 撿漏商品</h2>
            <form id="add-product-form" onsubmit="handleAddNewProduct(event)" class="space-y-3">
                <input type="text" id="p-name" placeholder="商品名稱" required class="w-full p-3 rounded-xl border bg-gray-50 text-sm">
                <select id="p-category" class="w-full p-3 rounded-xl border bg-gray-50 text-sm">
                    <option value="客製訂製">客製訂製</option>
                    <option value="繪圖委託">繪圖委託</option>
                    <option value="撿漏區">撿漏區 (限量)</option>
                    <option value="零食雜貨">零食雜貨</option>
                </select>
                <input type="number" id="p-price" placeholder="價格 (NT$)" required class="w-full p-3 rounded-xl border bg-gray-50 text-sm">
                <input type="number" id="p-stock" placeholder="庫存數量 (撿漏區請填剩餘件數)" required class="w-full p-3 rounded-xl border bg-gray-50 text-sm">
                <input type="text" id="p-image" placeholder="商品圖片網址 (可直接貼入圖片連結)" required class="w-full p-3 rounded-xl border bg-gray-50 text-sm">
                <textarea id="p-desc" placeholder="商品介紹、製作時間與注意事項..." rows="3" class="w-full p-3 rounded-xl border bg-gray-50 text-sm"></textarea>
                <button type="submit" class="w-full bg-[#D4A373] text-white py-3 rounded-xl font-bold">上架商品</button>
            </form>
        </div>

        <div class="bg-white rounded-3xl p-5 shadow-sm border">
            <h2 class="font-bold mb-3 text-lg">📦 現有商品管理</h2>
            <div id="admin-product-list" class="space-y-3">
                </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        if (typeof renderAdminProducts === 'function') renderAdminProducts();
    </script>
</body>
</html>
